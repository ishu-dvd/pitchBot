[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pitchbot"
version = "0.1.0"
description = "PitchBot zero-cost bilingual sales-call simulator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "PitchBot Team" }]
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.2,<3",
  "uvicorn[standard]>=0.30.6",
  "pydantic-settings>=2.5.2",
  "sqlalchemy>=2.0.35,<3",
  "alembic>=1.13.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
  "pip-audit>=2.7.3",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["^alembic/"]

[tool.hatch.build.targets.wheel]
packages = ["src/pitchbot"]
