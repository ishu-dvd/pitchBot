[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pitchbot"
version = "0.1.0"
description = "PitchBot zero-cost bilingual sales-call simulator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "PitchBot Team" }]
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.2,<3",
  "uvicorn[standard]>=0.30.6",
  "pydantic-settings>=2.5.2",
  "sqlalchemy>=2.0.35,<3",
  "alembic>=1.13.3,<2",
]

[project.scripts]
pitchbot-bench = "pitchbot.benchmarks.cli:main"
pitchbot-talk = "pitchbot.cli.talk:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
  "pip-audit>=2.7.3",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pre-commit>=3.8.0",
]
# Optional speech provider. Never a runtime requirement: pitchbot imports, and the whole
# test suite passes, with this absent. `webrtcvad-wheels` is the prebuilt-wheel
# distribution of `py-webrtcvad` (MIT binding over BSD-3-Clause WebRTC C code); it is a
# ~19 KiB CPU-only extension with no model weights, so installing it downloads nothing at
# import, construction, or detection time.
webrtc-vad = ["webrtcvad-wheels>=2.0.14,<3"]
# Optional text-to-speech provider. Never a runtime requirement: pitchbot imports, and the
# whole test suite passes, with this absent.
#
# `piper-tts` is **GPL-3.0-or-later** (it ships the GPL-3 text and bundles espeak-ng data),
# unlike the permissive `webrtc-vad` extra above. PitchBot never vendors or redistributes
# it and imports it only at runtime, so installing this extra is a deliberate act by the
# operator, who then owns the resulting distribution obligations. Its runtime dependency
# closure is just `onnxruntime` + `pathvalidate`; CPU-only, no accelerator.
#
# Voices are NOT installed by this extra and are never downloaded by PitchBot. Each voice
# carries its own separate license, and most published Piper voices are non-commercial --
# see `KNOWN_VOICE_LICENSES` in `pitchbot.adapters.piper_tts` and `docs/BENCHMARKS.md`.
piper-tts = ["piper-tts>=1.7.0,<2"]
# Optional speech-to-text provider. Never a runtime requirement: pitchbot imports, and the
# whole test suite passes, with this absent.
#
# `faster-whisper` and CTranslate2 are MIT; the `Systran/faster-whisper-*` weights are MIT
# and the upstream `openai/whisper-*` models they convert are Apache-2.0. All permissive --
# unlike the Piper *voices* above, which are mostly non-commercial.
#
# Model weights are NOT installed by this extra. The adapter passes `local_files_only=True`
# unless a caller explicitly opts in, so a missing model is a clear error rather than a
# silent multi-hundred-megabyte download mid-call or in CI.
faster-whisper = ["faster-whisper>=1.0.0,<2"]
# Optional local language model. Never a runtime requirement: the reply planner produces a
# relevant, slot-driven reply from the rules alone, so a deployment without this is fully
# functional and simply reads code-mixed input less well.
#
# `onnxruntime-genai` is MIT and depends only on numpy and onnxruntime, which the speech
# extras above already bring -- no PyTorch. It was chosen over `llama-cpp-python` (also MIT,
# better raw inference) for one decisive reason: llama-cpp-python publishes **no Windows
# wheel on PyPI at any version**, so installing it means a CMake and MSVC source build,
# which is not something a local-first product can ask of an operator.
#
# Model weights are NOT included and are never downloaded. They are operator-supplied ONNX
# Runtime GenAI directories, and the weight licence is checked against the **upstream**
# model id -- a quantised re-upload does not relicense what it converts. The Qwen2.5 family
# is licence-split (0.5B/1.5B Apache-2.0, 3B non-commercial); see `KNOWN_MODEL_LICENSES` in
# `pitchbot.adapters.onnx_genai_model` and `docs/BENCHMARKS.md`.
local-llm = ["onnxruntime-genai>=0.15.0,<1"]
# Optional microphone capture. Never a runtime requirement: pitchbot imports, and the whole
# test suite passes, with this absent - the voice loop is tested against a fake source, so
# CI needs no audio hardware.
#
# `sounddevice` is MIT and bundles PortAudio, also MIT. Permissive with no distribution
# obligation, unlike the `piper-tts` extra above. It is a pure-Python cffi binding with no
# model weights, so installing it downloads nothing at import or capture time.
#
# This is the only extra that needs *hardware* rather than a download. A machine with no
# input device installs it successfully and still cannot listen, so callers check
# `pitchbot.speech.microphone.is_available()` rather than assuming the import implies a mic.
microphone = ["sounddevice>=0.5,<1"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["^alembic/"]

[tool.hatch.build.targets.wheel]
packages = ["src/pitchbot"]
