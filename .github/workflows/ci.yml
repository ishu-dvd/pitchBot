name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: Tests
        run: pytest
      - name: Optional speech provider
        # Installed only here, after the suite has already passed without it, so "pitchbot
        # works with no provider installed" stays a proven property rather than an
        # assumption. The provider package is installed directly to leave the editable
        # install and the locked runtime dependencies untouched; that the `webrtc-vad`
        # extra actually declares it is asserted deterministically by the test suite.
        run: |
          pip install "webrtcvad-wheels>=2.0.14,<3"
          pytest tests/test_webrtc_vad_adapter.py
      - name: Migration check
        env:
          PITCHBOT_DATABASE_URL: sqlite:///./migration-check.db
        run: alembic upgrade head
      - name: Benchmark manifest check
        run: |
          pitchbot-bench validate-candidates benchmarks/candidates.json
          pitchbot-bench validate-corpus evals/corpora/speech-cases.json
          pitchbot-bench validate-speech-suite evals/corpora/vad-cases.json
          pitchbot-bench run-speech evals/corpora/vad-cases.json benchmark-results/vad.json --run-id vad-ci --git-revision ${{ github.sha }} --force
          pitchbot-bench validate-retrieval-suite evals/corpora/retrieval-cases.json
          pitchbot-bench run-retrieval evals/corpora/retrieval-cases.json benchmark-results/retrieval.json --run-id retrieval-ci --git-revision ${{ github.sha }} --force
          pitchbot-bench validate-graph-retrieval-suite evals/corpora/graph-retrieval-cases.json
          pitchbot-bench run-graph-retrieval evals/corpora/graph-retrieval-cases.json benchmark-results/graph-retrieval.json --run-id graph-retrieval-ci --git-revision ${{ github.sha }} --force
          pitchbot-bench validate-evaluation benchmark-results/retrieval.json
          pitchbot-bench validate-evaluation benchmark-results/graph-retrieval.json
          pitchbot-bench validate-evaluation benchmark-results/vad.json
      - name: Dependency audit
        run: pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
